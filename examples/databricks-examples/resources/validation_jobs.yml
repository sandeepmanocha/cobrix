resources:
  jobs:
    cobrix_validate_smoke:
      name: cobrix-validate-smoke
      tasks:
        - task_key: validate
          environment_key: default
          spark_jar_task:
            main_class_name: za.co.absa.cobrix.spark.cobol.serverless.spike.TableValidationMain
            parameters:
              - '--table'
              - ${var.catalog}.${var.schema}.cobrix_serverless_test1
              - '--expected-count'
              - '10'
              - '--expected-json'
              - /Volumes/${var.catalog}/${var.schema}/${var.volume}/test1_expected/test1.txt
      environments:
        - environment_key: default
          spec:
            environment_version: ${var.environment_version}
            java_dependencies:
              - ${var.jar_path}
              - ${var.examples_jar_path}

    cobrix_serverless_varlen:
