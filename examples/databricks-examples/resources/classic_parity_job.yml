resources:
  jobs:
    cobrix_classic_parity:
      name: cobrix-classic-parity
      tasks:
        - task_key: classic_cobol
          spark_python_task:
            python_file: ../src/classic_cobol.py
            parameters:
              - ${var.data_path}
              - ${var.copybook_path}
              - ${var.catalog}.${var.schema}.cobrix_classic_parity_test1
          job_cluster_key: classic
          libraries:
            - jar: ${var.classic_jar_path}
      job_clusters:
        - job_cluster_key: classic
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: i4i.xlarge
            num_workers: 1
            data_security_mode: SINGLE_USER
